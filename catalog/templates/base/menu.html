<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blogs:blogs' %}">Блоги</a>
        {% if user.is_authenticated %}
        <form method="post" enctype="multipart/form-data" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">
                Выйти
            </button>
        </form>
        {% else %}
        <a href="{% url 'users:create_user' %}" class="p-2 btn btn-outline-primary">Зарегистрироваться</a>
        <a href="{% url 'users:login' %}" class="p-2 btn btn-outline-primary">Войти</a>
        {% endif %}
    </nav>
</div>
